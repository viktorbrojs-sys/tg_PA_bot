[project]
name = "tg-obsidian-bot"
version = "1.11.0"
description = "Telegram bot that appends tasks to an Obsidian markdown file"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot==22.7",
    "python-dotenv==1.1.0",
    "httpx==0.28.1",
    "apscheduler==3.11.0",
    "tzdata==2025.2",
    "sqlite-vec==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-httpx==0.35.0",
    "ruff==0.7.4",
    "mypy==1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
files = ["bot"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
